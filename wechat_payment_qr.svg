<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- 绿色背景 -->
  <rect width="300" height="300" fill="#07C160"/>
  
  <!-- 白色内容区域 -->
  <rect x="30" y="30" width="240" height="240" rx="10" fill="white"/>
  
  <!-- 标题 -->
  <text x="150" y="60" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#07C160" text-anchor="middle">推荐使用微信支付</text>
  
  <!-- 金额 -->
  <text x="150" y="90" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">¥6.66</text>
  
  <!-- 二维码图案 -->
  <g transform="translate(50, 100)">
    <!-- 定位图案 -->
    <rect x="0" y="0" width="50" height="50" fill="black"/>
    <rect x="10" y="10" width="30" height="30" fill="white"/>
    <rect x="20" y="20" width="10" height="10" fill="black"/>
    
    <rect x="140" y="0" width="50" height="50" fill="black"/>
    <rect x="150" y="10" width="30" height="30" fill="white"/>
    <rect x="160" y="20" width="10" height="10" fill="black"/>
    
    <rect x="0" y="140" width="50" height="50" fill="black"/>
    <rect x="10" y="150" width="30" height="30" fill="white"/>
    <rect x="20" y="160" width="10" height="10" fill="black"/>
    
    <!-- 中心用户区域 -->
    <circle cx="100" cy="100" r="20" fill="#E0E0E0"/>
    <circle cx="100" cy="100" r="10" fill="#07C160" opacity="0.8"/>
    <path d="M90,95 L95,95 L95,105 L90,105 Z" fill="white"/>
    <path d="M105,95 L110,95 L110,105 L105,105 Z" fill="white"/>
    <path d="M90,105 L110,105 L110,110 L90,110 Z" fill="white"/>
    
    <!-- 模拟二维码点阵 -->
    <rect x="60" y="60" width="10" height="10" fill="black"/>
    <rect x="80" y="60" width="10" height="10" fill="black"/>
    <rect x="100" y="60" width="10" height="10" fill="black"/>
    <rect x="120" y="60" width="10" height="10" fill="black"/>
    <rect x="60" y="80" width="10" height="10" fill="black"/>
    <rect x="120" y="80" width="10" height="10" fill="black"/>
    <rect x="60" y="120" width="10" height="10" fill="black"/>
    <rect x="120" y="120" width="10" height="10" fill="black"/>
    <rect x="60" y="140" width="10" height="10" fill="black"/>
    <rect x="80" y="140" width="10" height="10" fill="black"/>
    <rect x="100" y="140" width="10" height="10" fill="black"/>
    <rect x="120" y="140" width="10" height="10" fill="black"/>
  </g>
  
  <!-- 底部用户名 -->
  <text x="150" y="250" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">Ash(东)</text>
  
  <!-- 微信支付图标 -->
  <g transform="translate(130, 270)">
    <circle cx="0" cy="0" r="10" fill="#07C160"/>
    <path d="M0,-6 A6,6 0 1,1 0,6" stroke="white" stroke-width="2" fill="none"/>
    <path d="M-4,0 L0,-2 L4,0" stroke="white" stroke-width="2" fill="none"/>
  </g>
  <text x="170" y="275" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">微信支付</text>
</svg>